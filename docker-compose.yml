# docker compose up -d   →  http://<server-ip>:8000
# Set SECRET_KEY, POSTGRES_PASSWORD and BOOTSTRAP_ADMIN_PASSWORD in a .env file next to this file first.
services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: trackflow
      POSTGRES_USER: trackflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trackflow -d trackflow"]
      interval: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://trackflow:${POSTGRES_PASSWORD}@db:5432/trackflow
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-admin@trackflow.local}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD}
      CORS_ORIGINS: ""
    volumes:
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
